# identities/harness.yml
#
# Harness's bot identity + routing rules. See identities/README.md for the contract.
# Placeholder values are `~`; real values fill in during Phase 2 (Harness deploy wave,
# alongside Strategist).
#
# IMPORTANT: Harness is the only agent that mutates dev-team/. Its GitHub App is
# installed on the dev-team repo (and ONLY the dev-team repo — not on target
# project repos).

agent: harness

# ============================================================================
# GitHub App identity
# ============================================================================
github:
  app_slug: dev-team-harness                      # https://github.com/apps/dev-team-harness
  app_id: ~                                        # numeric App ID; fill at deploy
  bot_username: harness-agent                     # display name in reply footers (parallel to strategist-agent)
  installation_url: ~                                                                # fill at deploy
  # Harness only installs on the dev-team repo. Target projects are off-limits.
  installations:
    dev_team_repo: ~                               # installation_id for dev-team repo; fill at deploy

# ============================================================================
# Linear agent identity
# ============================================================================
linear:
  agent_handle: harness-bot
  agent_id: ~
  user_id: ~

# ============================================================================
# Slack app identity
# ============================================================================
slack:
  app_id: ~           # fill at deploy
  bot_user_id: ~           # fill at deploy
  team_id: ~                                         # workspace id — consumed by the slack MCP as ${SLACK_TEAM_ID}; fill at deploy
  channels:
    primary:
      - "#harness-engineering"                    # dedicated channel for meta-work; primary
      - "#agents-alerts"                          # escalation channel
    # Harness also posts to agent-specific channels when its changes materially
    # affect those agents (so future sessions of those agents see the heads-up).
    #
    # NOTE (drift risk, guarded): this map DUPLICATES each agent's own
    # `slack.channels.primary` (see identities/<agent>.yml). If an agent moves its
    # primary channel, this map goes stale and Harness would crosspost to the wrong
    # channel. A drift guard now catches that: `checkCrosspostsDrift`
    # (router/src/routing/crossposts.ts) runs at router boot and logs a warning for
    # any crosspost that diverges from an agent's primary / targets an unknown agent /
    # is missing for a Slack-enabled agent, and a test asserts these shipped
    # identities stay in sync (router/tests/routing/crossposts.test.ts). Longer-term
    # ideal is still to derive the target at runtime from the affected agent's own
    # identity (single source of truth) and drop this map entirely.
    crossposts:
      strategist: "#engineering"
      platform: "#engineering"
      builder-server: "#engineering"
      builder-client: "#engineering"
      guardian: "#security"
      marketer: "#marketing"
    alerts: "#agents-alerts"

# ============================================================================
# Routing rules
# ============================================================================
routing:
  linear_labels:
    - harness                                     # generic Harness work
    - agent-improvement                           # → agent-modifier skill
    - agent-misbehavior                           # → misbehavior-debugger skill
    - meta                                        # generic meta-work
    - gap-analysis                                # → gap-analyzer skill (on-demand)
    - new-agent                                   # → agent-architect skill
    - new-skill                                   # → skill-author skill
    - router-change                               # → router-engineer skill
    - harness-bot                                 # explicit routing-by-label
  slack_default_channels:
    - "#harness-engineering"                      # channel-default routing
  github_auto_triggers: []                        # Harness does NOT auto-fire on target-project PRs.
                                                  # (PRs on the dev-team repo itself are reviewed by humans,
                                                  # not by Harness.)

# ============================================================================
# Conversation continuity
# ============================================================================
continuation_timeout_days: 30                     # multi-day agent-authoring threads OK within 30d window

# ============================================================================
# Secret references (NAMES only — values in Infisical)
# ============================================================================
secrets:
  github_app_private_key: GITHUB_APP_PRIVATE_KEY_harness
  github_webhook_secret: GITHUB_APP_WEBHOOK_SECRET_harness
  linear_token: LINEAR_TOKEN_harness
  linear_webhook_secret: LINEAR_WEBHOOK_SECRET_harness
  slack_bot_token: SLACK_BOT_TOKEN_harness
  slack_signing_secret: SLACK_SIGNING_SECRET_harness
  anthropic_api_key: ANTHROPIC_API_KEY
