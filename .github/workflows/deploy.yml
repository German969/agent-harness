name: deploy

# Deploys router source + compose changes to the VPS. MANUAL ONLY — run it from
# the Actions tab (deploy -> Run workflow) or `gh workflow run deploy.yml`. There is
# deliberately no push trigger, so a merge to main never auto-deploys the router;
# you deploy on demand once you're ready. The verify job (ci.yml) still runs first,
# so a manual deploy won't ship unless lint/typecheck/test/build are green.
# Note: agent config (CLAUDE.md, settings, skills, mcp.json) is re-read per session,
# so those changes land via the git-pull sidecar without a deploy at all. `identities/*.yml`
# does NOT — the routing registry is built once at boot and has no reload path, so an
# identity edit needs a manual deploy to recreate the router. Router code changes
# (router/**, deploy/**) likewise wait for a manual run.
#
# Requires these repo secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST        public host/IP of the VPS
#   VPS_USER        ssh user (recommend `agents` — in the docker group, owns /opt/dev-team)
#   VPS_SSH_KEY     PRIVATE key of a DEDICATED deploy keypair (its .pub is in the
#                   user's ~/.ssh/authorized_keys on the VPS). Never a personal key.
#   VPS_KNOWN_HOSTS output of `ssh-keyscan <VPS_HOST>` — pins the host key.

on:
  workflow_dispatch: {}

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  # Gate: reuses ci.yml so the checks live in exactly one place.
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        # Pull first, then run the (now up-to-date) script. This bootstraps the
        # script itself on the very first run and self-updates it thereafter, so
        # /opt/dev-team only ever needs to be a valid clone of the repo.
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${VPS_USER}@${VPS_HOST}" \
            'cd /opt/dev-team && git fetch --quiet origin main && git reset --hard origin/main && sh deploy/scripts/remote-deploy.sh'
