name: ci

# Verification gate for the router. Runs the same four checks a contributor runs
# locally (`pnpm lint/typecheck/test/build`) on every PR and every push to main.
#
# This workflow is also callable (`workflow_call`) so deploy.yml can depend on it —
# nothing reaches the VPS without these passing. See deploy.yml.
#
# Node and pnpm versions are pinned to match deploy/Dockerfile exactly. If you bump
# one, bump the other, or CI stops testing what production runs.

on:
  pull_request:
    paths:
      - 'router/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'
      # fleet-config's own paths are guarded by a vitest test (HAR-25), so a change
      # to that workflow alone has to run this one.
      - '.github/workflows/fleet-config.yml'
  push:
    branches: [main]
    paths:
      - 'router/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'
      # fleet-config's own paths are guarded by a vitest test (HAR-25), so a change
      # to that workflow alone has to run this one.
      - '.github/workflows/fleet-config.yml'
  workflow_call: {}

concurrency:
  # `github.workflow` is included because this workflow runs TWICE for one push to
  # main: once from its own `push` trigger, and once as deploy.yml's `verify` job via
  # workflow_call. With a group of just `ci-<ref>` both runs shared it, and
  # cancel-in-progress made them cancel each other — a race whose loser was arbitrary.
  #
  # When the loser was the standalone push run, nothing broke and nobody noticed. When
  # it was deploy's `verify` (7d2f33ff, PR #39), `verify` was cancelled three seconds
  # in, the `deploy` job was skipped for a failed dependency, and the merge silently
  # never reached the VPS. Deploys had been winning that coin flip for #36, #37 and #38.
  #
  # In a reusable workflow `github.workflow` is the CALLER's name, so the two runs land
  # in `ci-ci-<ref>` and `ci-deploy-<ref>` and stop colliding. Cancel-in-progress still
  # does its real job: superseding an older run of the SAME kind on the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: router
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Matches `corepack prepare pnpm@…` in deploy/Dockerfile.
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          # Matches the `node:20.10.0-bookworm-slim` base image in deploy/Dockerfile.
          node-version: 20.10.0
          cache: pnpm
          cache-dependency-path: router/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Guards the ops-diag workflow's command quoter. It is the boundary that keeps a
      # dispatched `command` inside deploy/scripts/ops.sh's allowlist instead of
      # running as a second shell command on the VPS, so a regression there is a
      # security regression. python3 is preinstalled on the runner; this is ~0.1s.
      - name: ops command quoter selftest
        working-directory: .
        run: python3 .github/scripts/quote-op.py --selftest
