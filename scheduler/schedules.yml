# ============================================================================
# HARNESS (meta-agent)
# ============================================================================

- id: harness-gap-analyzer-monthly
  cron: "0 14 1 * *"
  timezone: America/New_York
  agent: harness
  skill: gap-analyzer
  trigger:
    kind: scheduled
    message: |
      Run the monthly gap-analyzer survey (per gap-analyzer.md):
      - Read every agent's CLAUDE.md, settings.json, skills/, mcp.json (auto-loaded)
      - Look for patterns repeated across agents that could be promoted
      - Look for SPEC sections referenced but not yet implemented
      - Look for new behaviors humans have requested in #harness-engineering this month
      - Cross-reference against the misbehavior log
      - Score findings (Low/Medium/High); cap at 20 candidate findings
      Output: a digest posted to #harness-engineering. NO auto-PRs from this skill —
      humans triage the digest and pick which items to ask Harness to implement.
      Append the survey to dev-team-state/global/harness/gap-survey-history.md.
    reply_to:
      provider: slack
      channel: "#harness-engineering"
  enabled: false
  requires_project_phase: phase-2
  # Notes:
  #  - Enable once Harness is online + at least 1 other agent exists to analyze.
  #  - Digest-only by design: surfacing gaps, not auto-implementing them. Humans pick what to act on.

# ============================================================================
# BUILDER-SERVER + BUILDER-CLIENT
# ============================================================================
#
# Both Builder agents are reactive-only — they don't have scheduled jobs in
# their SPECs. Their work is triggered by:
#   - Linear ticket assignment (new feature work)
#   - PR review comments (pr-feedback skill)
#   - PR push to their branches (Builder picks back up)
#   - API contract bounce-backs from each other
#
# If a future skill (e.g. nightly dependency-update sweep, weekly tech-debt
# review) adds a cron pattern, add the entry here.
