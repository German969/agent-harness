# Guardian's path-tier classification — the file AGENTS.md, PROTOCOLS.md §2,
# Guardian's SPEC and Strategist's `curator` skill have all referenced since they
# were written, and which did not exist until now.
#
# WHO READS THIS
#   - Guardian, in its `qa` skill, on every PR-triggered session. It classifies
#     the PR's changed files (fetched from the GitHub MCP — the local checkout is
#     on the base branch) and picks its scan depth from the result.
#   - Strategist's `curator` skill, weekly, as the drift backstop: walk the
#     codebase for paths matching a family, cross-reference here, propose what is
#     missing (PROTOCOLS.md §2, "Knowledge Curator backstop").
#   - `pnpm validate:fleet`, which checks this file parses and every entry is
#     well-formed. A malformed entry is worse than a missing one: it reads as
#     coverage that is not there.
#
# WHO WRITES IT
#   Guardian only. Code-writing agents propose additions as a PR comment and never
#   edit this file — PROTOCOLS.md §2, "Producer responsibilities". The target
#   project keeps its own producer-side copy of the FAMILIES at
#   `tools/guardrails/src/families.ts`, with the paths it has already dispositioned
#   in `.github/sensitive-path-candidates.json`. That copy exists to decide whether
#   to *prompt* a proposal; this file is the authority. When they disagree, this
#   one wins and the copy is stale.
#
# TIERS — AGENTS.md "Guardian auto-trigger — three-tier path scan"
#   skip   docs and prose only. No scan, no comment.
#   light  any other code path. Quick QA coverage, dep-CVE scan, secret leak,
#          design-system compliance. Comment only if there are findings.
#   deep   anything matching a `patterns` entry below. Full QA + threat-model diff
#          + auth/authz review + perf + compliance. ALWAYS comments, even "all
#          clear", so a reviewer can see the deep scan ran.
#
# PRECEDENCE: deep wins. A PR touching both `docs/**` and a deep path is deep —
# the skip list is not an escape hatch, it only spares a docs-only PR.

version: 1

# The families a `patterns` entry may name. Transcribed from PROTOCOLS.md §2's
# table; `user-data` is in the protocol and absent from the producer-side copy,
# which is a known gap in that copy rather than in the protocol.
families:
  - auth
  - payments
  - secrets
  - user-data
  - migrations
  - infra
  - ai-prompts
  - webhooks
  - audit
  # Project extension (PROTOCOLS.md §2): not in the protocol's table. The reasoning is
  # dev-team-state/projects/iris/guardian/sensitive-pattern-families.md, Extension 4.
  - agent-authority

# Inert prose. Matched against the WHOLE changed-file set: if every changed path
# matches one of these, the tier is skip.
#
# NARROWED 2026-09-16. This list used to be `docs/**` + `**/*.md`, which skipped every
# markdown file in the repo. That is the wrong test: **a file being markdown says nothing
# about whether changing it changes behaviour.** Four classes were being skipped that
# should not have been —
#
#   founding/**          the stack, product, brand and COMPLIANCE of record.
#                        compliance-scope.yml is DERIVED from founding/COMPLIANCE.md, so a
#                        change here can invalidate the very baseline Guardian loads on
#                        every review session, and Guardian was configured not to look.
#   docs/adrs/**         accepted architecture decisions.
#   docs/architecture/** SYSTEM.md, which CLAUDE.md's founding-docs gate requires before
#                        Guardian will review anything at all.
#   docs/runbooks/**     procedures a human executes against live infrastructure. Not
#                        prose — code with a person as the interpreter.
#   .claude/**           agent instructions stored as markdown. Changing one changes what
#                        an agent does; the extension is incidental.
#                        Except .claude/settings*.json, which is deep since 2026-10-02 —
#                        see the agent-authority entries under `patterns` (IRS-81).
#
# WHAT PROMPTED IT: chatbots PR #26 (2026-09-16) changed founding/STACK.md, an ADR and a
# runbook. Guardian classified it skip and posted nothing. Copilot reviewed the same diff
# and found four real defects, including an unguarded `read` that could have migrated the
# wrong database if the prompt were interrupted. Guardian's own eval of that PR was that
# the routine behaved exactly as configured — which made the configuration the finding.
#
# These paths now fall to LIGHT, not deep. Light comments only when there are findings, so
# a genuinely prose-only change to an ADR stays silent. The cost is a scan, not noise.
#
# DIVERGENCE, DELIBERATE AND TRACKED: AGENTS.md → "Guardian auto-trigger — three-tier path
# scan" still states the old skip row as a locked decision. This file is the one every
# consumer actually reads, so it leads; reconciling AGENTS.md is HAR-15. Until that lands,
# AGENTS.md is the stale copy — the same way SPEC.md §6 is stale about this file's
# location.
skip:
  - "README.md"
  - "CONTRIBUTING.md"
  - "**/README.md"
  - "docs/GLOSSARY.md"
  - "docs/legacy/**"
  - "CODEOWNERS"
  - ".github/CODEOWNERS"
  - "LICENSE"

# Deep-tier patterns. Every entry carries why it was added, per PROTOCOLS.md §2
# ("Each addition carries a brief comment explaining why it was added").
#
# Two kinds live here on purpose. FAMILY patterns are generic and mostly match
# nothing today — they exist so the first commit at such a path is deep-scanned
# rather than noticed a release later. CONCRETE patterns name code that exists in
# the target project right now.
patterns:
  # --- family patterns: broad, forward-looking ---
  - glob: "**/auth*/**"
    family: auth
    added: 2026-09-03
    reason: "Family pattern. No auth module exists in iris yet; this is here so the first one is deep-scanned on the PR that introduces it, not on the PR after somebody notices."
  - glob: "**/{authentication,authorization,permissions,session,sessions,rbac}/**"
    family: auth
    added: 2026-09-03
    reason: "Family pattern, the named-directory half of the auth family in PROTOCOLS.md §2. `session` (singular) added 2026-10-02: chatbots#45 landed apps/iris-api/src/session/, whose controller serves GET /session (the caller's user, tenant id and tenant name from the guard-resolved context), and the plural-only list missed it."
  - glob: "**/{payment,payments,billing,subscription,subscriptions,invoice,invoices}/**"
    family: payments
    added: 2026-09-03
    reason: "Family pattern. Iris is a paid product (founding/PRODUCT.md); billing code is expected and must never land at light tier."
  - glob: "**/{stripe,paddle,chargebee}*"
    family: payments
    added: 2026-09-03
    reason: "Family pattern — payment processor integrations, named by vendor as PROTOCOLS.md §2 lists them."
  - glob: "**/{secret,secrets,credentials,vault}*/**"
    family: secrets
    added: 2026-09-03
    reason: "Family pattern. Secret handling is the one family where a shallow review has no acceptable failure mode."
  - glob: "**/*.env*"
    family: secrets
    added: 2026-09-03
    reason: "Family pattern. An env file in a diff is either a leak or a config change that decides where secrets come from; both want a deep look."
  - glob: "**/{user,users,profile,identity,pii}/**"
    family: user-data
    added: 2026-09-03
    reason: "Family pattern. PROTOCOLS.md §2 also lists content-dependent PII (code handling email / phone / address / dob), which a path matcher cannot see — those still rely on the reviewer."
  - glob: "**/{migration,migrations}/**"
    family: migrations
    added: 2026-09-03
    reason: "Family pattern. Migrations are irreversible in production in a way application code is not."
  - glob: "**/webhooks/**"
    family: webhooks
    added: 2026-09-03
    reason: "Family pattern. A webhook endpoint is unauthenticated attack surface by construction — it is reachable by anyone who learns the URL."
  - glob: "**/oauth*/**"
    family: webhooks
    added: 2026-09-03
    reason: "Family pattern, the OAuth-callback half of the webhooks/external-integrations family."
  - glob: "**/audit*/**"
    family: audit
    added: 2026-09-03
    reason: "Family pattern. An audit log that can be tampered with or silently dropped is worse than none."
  - glob: "**/{Dockerfile,Dockerfile.*}"
    family: infra
    added: 2026-09-03
    reason: "Family pattern. The image is the production runtime; a base-image or user change is a security change."
  - glob: "{terraform,pulumi,infra}/**"
    family: infra
    added: 2026-09-03
    reason: "Family pattern. Infrastructure-as-code changes production directly."
  - glob: "**/.railway/**"
    family: infra
    added: 2026-10-03
    reason: "Railway Infrastructure as Code (`.railway/railway.ts`) declares services, variables, domains, replicas and a preDeploy command, so it changes production directly. The `{terraform,pulumi,infra}/**` family glob misses it because the directory is `.railway/`. Not adopted yet (IRS-87); pre-registered so the adopting PR scans Deep. Replaces the 2026-09-25 `**/railway.{json,toml}` proposal: Railway deprecated config-as-code, new services can't opt in, and chatbots#33 withdrew its railway.json."

  # --- concrete patterns: code that exists in iris today ---
  - glob: ".github/workflows/**"
    family: infra
    added: 2026-09-03
    reason: "Exists today (ci.yml, dependency-audit.yml). A workflow change can disable a check, widen a token's permissions, or run untrusted code with repo credentials — IRS-59 added a guard for exactly the permissions half."
  - glob: "packages/db/drizzle/**"
    family: migrations
    added: 2026-09-03
    reason: "The committed migration SQL (0000_init.sql, 0001_m1_feature_schema.sql) and drizzle/meta snapshots. Applied against production data once and not undone."
  - glob: "packages/db/src/schema/**"
    family: user-data
    added: 2026-09-03
    reason: "Tenant isolation lives here. ADR-0016 keeps Postgres RLS to dev only, so in production the composite (tenant_id, x) foreign keys in this schema are the enforcement — a change here can silently make cross-tenant reads possible."
  - glob: "packages/llm/**"
    family: ai-prompts
    added: 2026-09-03
    reason: "Prompt and model-routing code. IRS-59 records that this package has no LLM-security test suite yet and gates on adding one; until it does, a deep read is the only check there is."
  - glob: "apps/iris-web/app/api/**"
    family: webhooks
    added: 2026-09-03
    reason: "Next.js route handlers — the public HTTP surface of the web app, including anything WhatsApp calls back into."
  - glob: "apps/iris-api/src/tenancy/**"
    family: user-data
    added: 2026-10-01
    reason: "Tenant isolation, runtime half. Introduced by chatbots#45 (IRS-43): tenant-provisioning.ts is ADR-0016's documented bypass, reading and writing `tenants` (the root of the isolation hierarchy) outside the tenant-scoped repositories, and tenant-context.ts is the request-scoped context IRS-44's repositories filter on. Same rationale as packages/db/src/schema/**: a change here can silently make cross-tenant reads possible. Proposed by Builder-Server on chatbots#45."

  # --- IRS-63, 2026-10-02: the curator backstop's four proposals of 2026-09-04,
  # re-checked against chatbots main at 8321965 and dispositioned. Rejections and
  # their reasons are on the ticket, not here.
  - glob: "packages/db/src/**"
    family: user-data
    added: 2026-10-02
    reason: "The rest of the database package beyond schema/** (which keeps its own entry): client.ts, the tables.ts barrel, index.ts, and wherever IRS-44's tenant-scoped repository layer lands if it lands in this package. That layer is the sole production enforcement of tenant isolation (ADR-0016: no RLS in prod), so the schema it protects being deep while the enforcement is light was backwards. IRS-63 proposal 1, widened to the directory so a new file here is covered on the PR that adds it."
  - glob: "packages/db/drizzle.config.ts"
    family: migrations
    added: 2026-10-02
    reason: "Decides what drizzle-kit generates: its `schema: './src/schema/*.ts'` glob is how a new table reaches a migration. Narrowing it drops tables from migrations and still passes the CI migrations gate, as the file's own comment warns. packages/db/drizzle/** (the output) was deep; the config that produces it was not. IRS-63 proposal 3."
  - glob: "tools/guardrails/src/**"
    family: infra
    added: 2026-10-02
    reason: "The code the CI `guardrails` job runs, including findSensitiveCandidates in guards.ts — the producer side of PROTOCOLS §2. A change here can mute a check, and IRS-60 (nothing protects the checks from being weakened) is still open. test/ is deliberately excluded. Also matches audit-liveness*.ts, which the target's .github/sensitive-path-candidates.json marks not-sensitive: that file decides whether to prompt a proposal, this one decides scan depth, and a deeper scan of two small files is cheap. IRS-63 proposal 2."
  - glob: "apps/iris-api/src/app.module.ts"
    family: auth
    added: 2026-10-02
    reason: "Composes AuthModule, which registers AuthGuard as the global APP_GUARD (IRS-43, chatbots#45). Dropping that import makes every route public with no change under auth/ — so **/auth*/** alone does not cover it. IRS-63 proposal 4 called this file a future seam; it is now load-bearing."
  - glob: "apps/iris-api/src/http.ts"
    family: infra
    added: 2026-10-02
    reason: "The API's CORS policy (IRS-43): which origins may call it with a bearer token. IRS-63 proposal 4 expected this to land in main.ts; it landed here, and main.ts only calls it (removing that call fails closed for browsers, so main.ts is not added)."
  - glob: "apps/iris-api/src/queue/{migrate,boss.provider}.ts"
    family: migrations
    added: 2026-10-02
    reason: "pg-boss's schema DDL. boss.provider.ts holds both halves: installQueueSchema runs it (migrate: true), and startPgBoss's `migrate: false` is the one setting that stops every API and worker boot from changing the production schema unreviewed, outside ADR-0010's gate. migrate.ts is the `pnpm queue:migrate` entry point that calls it. The pgboss schema lives in the app's own Postgres, so this is a migration in everything but path name; the `migrations` family glob does not reach it."
  - glob: "apps/iris-api/src/config/**"
    family: secrets
    added: 2026-10-03
    reason: "The boot-time env contract (IRS-69, chatbots#58): env-contract.ts lists which variables each process refuses to start without, and required-env.ts is the shared not-set/empty check. Removing or downgrading an entry silently lets a service boot without a credential, and nothing visible changes at runtime until the first request that needs it. Same 'a change here can mute a check' reasoning as tools/guardrails/src/**, applied to secrets handling. Raised by Guardian's review of chatbots#58."
  - glob: ".github/sensitive-path-candidates.json"
    family: infra
    added: 2026-10-02
    reason: "The ledger the target's `sensitive-path-candidates` guard reads before it asks for a proposal: any glob listed here, `proposed` or `not-sensitive`, mutes the guard for that path. A careless or wrong entry silences the check that feeds this registry, which is the same 'a change here can mute a check' reasoning as tools/guardrails/src/**. Raised as a minor finding by Guardian's review of chatbots#50."

  # --- IRS-107, 2026-10-03: the worker half of tenant isolation, found by Guardian's review of chatbots#55.
  - glob: "apps/iris-api/src/worker/**"
    family: user-data
    added: 2026-10-03
    reason: "Tenant isolation, worker half. chatbots#55 (IRS-107) put ADR-0016's worker rule here: tenant-job.ts validates the job payload's tenantId and builds TenantContext.forWorker(tenantId) before a handler may touch a repository, and worker.service.ts decides which queues run through it. A change here can run a handler under the wrong tenant, or with none, and apps/iris-api/src/tenancy/** (deep) is only the other half. Every future tenant-queue handler (worker-ingest, IRS-48) lands in this directory."
  - glob: "apps/iris-api/src/queue/{queues,queue.service}.ts"
    family: user-data
    added: 2026-10-03
    reason: "Tenant isolation, producer half. queues.ts holds QUEUE_SCOPES: flipping a queue from 'tenant' to 'system' there turns off the worker's tenantId check for it, with no change under worker/. queue.service.ts's sendForTenant is the only place a job's tenantId is stamped from the caller's scope and a foreign tenant refused. boss.provider.ts and migrate.ts in the same directory are already deep (migrations family); these two files are not covered by that entry."

  # --- IRS-193, 2026-10-09: the callers that build model payloads (Strategist drift sweep).
  # packages/llm/** (the client) was deep; the code that decides what goes into a prompt
  # was not. Extension 2 (`llm-payload-path`) in dev-team-state's
  # projects/iris/guardian/sensitive-pattern-families.md proposed these "once the code
  # exists"; it landed in M1. They use the existing `ai-prompts` family rather than a new
  # one: the review they need is the same. A path cannot catch every new payload path
  # (one can be built anywhere), so the reviewer still has to; these are the known homes.
  - glob: "apps/iris-api/src/engine/**"
    family: ai-prompts
    added: 2026-10-09
    reason: "The conversation engine: every customer reply. prompt-assembly.ts orders the prompt and marks which parts are `tenant` and `untrusted` for @app/llm to fence, history-window.ts picks which end-consumer messages reach the model (ADR-0012's first payload path, whose redaction is wired here), query-expansion.ts sends the customer's question for rewriting, and sentinel.ts/reply-check.ts decide when the model's reply is replaced by the fallback and what check line it must write first. A change here can drop a trust fence, widen what history is sent, or let an ungrounded reply through, with no change under packages/llm/**. Extension 2 proposed `**/conversation-engine/**`, which never matched: the directory is engine/. IRS-193."
  - glob: "apps/iris-api/src/builder-agent/**"
    family: ai-prompts
    added: 2026-10-09
    reason: "Leo, the onboarding agent: leo-prompt.ts is its system prompt, builder-agent.service.ts runs the tool loop, and tools.ts holds the tools the model may call, which write the tenant's agent config. That makes it the one place where model output turns directly into tenant writes, so a new tool or a loosened argument check is a privilege change for the model: the `auto`-tier tools write config inside the turn with no Admin confirmation, and budget.ts holds the per-tenant token ledger (both raised by Guardian's review of chatbots#112, dev-team#92). It is also ADR-0012's second payload path once Leo samples end-consumer conversations. IRS-193."
  - glob: "apps/iris-api/src/knowledge/qa-extraction*.ts"
    family: ai-prompts
    added: 2026-10-09
    reason: "The FAQ-to-Q&A path (IRS-163): tenant-uploaded document text goes into a model prompt, and the extracted pairs are stored as knowledge the engine then quotes to customers. That makes it both an LLM payload path (it redacts and restores ADR-0012 tokens, so it is the fourth path COMPLIANCE.md says needs a compliance review, see IRS-167) and an indirect prompt-injection surface: a hostile document can steer what becomes a published answer. ingestion-pipeline.ts in the same directory only sends chunks to the embeddings endpoint, with no prompt and no model output acted on, so it is not an ai-prompts path; it is deep anyway through apps/iris-api/src/knowledge/** (user-data). IRS-193."
  - glob: "apps/iris-api/src/sandbox/**"
    family: ai-prompts
    added: 2026-10-09
    reason: "The sandbox (IRS-16a, chatbots#106): sandbox.service.ts chooses the draft prompt recipe the engine runs with and sends the Admin's message to the model, and sandbox.controller.ts plus sandbox-stream.ts stream model output to the browser over SSE (the AC-12 surface: guards before the stream opens, JSON-only frames, no error text after it). Its tenant isolation is in packages/db/src/tenancy/sandbox.ts, already deep under packages/db/src/**. IRS-193."

  # --- 2026-10-12: Guardian's per-review registry proposals of 2026-10-05..09, combined into
  # one change at German's request. Each was raised by a chatbots PR review and opened as its
  # own dev-team PR (#86-#98). The engine and builder-agent ones were superseded by IRS-193's
  # entries above; these are the rest, re-checked against chatbots main b17feb8.
  - glob: "apps/iris-web/middleware.ts"
    family: auth
    added: 2026-10-12
    reason: "The only enforcement point for 'every dashboard route needs a Clerk session and an active business' (chatbots#69, IRS-7). It runs Clerk's clerkMiddleware, calls gate() from lib/auth/routes.ts (already deep via **/auth*/**), and its `config.matcher` decides which paths the gate sees at all: a matcher edit can silently exempt a route from authentication while every gate() test still passes. The `**/auth*/**` family glob misses it because the file sits at the app root, not in an auth directory. Raised by Guardian's review of chatbots#69 (dev-team#86)."
  - glob: ".github/heavy-table-queries.json"
    family: infra
    added: 2026-10-12
    reason: "The ledger the target's `heavy-table-queries` guard reads (IRS-62, chatbots#68, ADR-0021): a file with an entry here, `reviewed` or `not-a-query`, is exempt from the check that asks for its queries to be run against tools/volume-check before it reads knowledge_chunks, messages or conversations. One wrong entry silences the check for that file, which is the same 'a change here can mute a check' reasoning as .github/sensitive-path-candidates.json. Raised by Guardian's review of chatbots#68 (dev-team#87)."
  - glob: "apps/iris-api/scripts/**"
    family: migrations
    added: 2026-10-12
    reason: "The Railway pre-deploy scripts (chatbots#78): predeploy-migrate.sh runs `pnpm db:migrate` and `pnpm queue:migrate` against staging's database on every deploy, and its `RAILWAY_ENVIRONMENT_NAME == staging` guard is the only thing stopping that command from migrating production if it is copied into that environment's settings (STACK.md: production migration is manual, a non-negotiable). It runs DDL against a live database yet matches no migrations glob. A script-only change here (weakening the guard, changing how the direct URL is derived) would otherwise land at Light. Raised by Guardian's review of chatbots#78 (dev-team#88)."
  - glob: "**/vercel.json"
    family: infra
    added: 2026-10-12
    reason: "Deploy configuration for the web app (chatbots#86, apps/iris-web/vercel.json): its `ignoreCommand` decides which pushes build, and a wrong exit code or an incomplete path list silently skips a production deploy of main with nothing failing. Also carries redirects, headers and rewrites when added, which are production routing and security headers. The `{terraform,pulumi,infra}/**` family glob misses it. The script it calls (apps/iris-web/scripts/vercel-ignore-build.sh) is not added: it fails open (builds when unsure), and the file that wires it in is the one that matters. Raised by Guardian's review of chatbots#86 (dev-team#90)."
  - glob: "apps/iris-api/src/storage/**"
    family: user-data
    added: 2026-10-12
    reason: "Object storage (IRS-11, chatbots#98): R2ObjectStorage is the bucket credentials' only consumer and the one place tenant files are written, copied and deleted. Keys are tenant-prefixed (`tenants/{tenant}/...`, `staging/{tenant}/...`), and that prefix is the isolation boundary for stored documents, as the composite foreign keys are for rows: a change here can read or write across tenants with nothing under tenancy/ changing. Raised by Guardian's review of chatbots#98 (dev-team#91)."
  - glob: "apps/iris-api/src/knowledge/**"
    family: user-data
    added: 2026-10-12
    reason: "Tenant knowledge ingestion. Since chatbots#98 (IRS-11) it parses untrusted uploaded files (extractors/ for PDF, DOCX, MD, TXT; document-files.ts zip-bomb and macro checks; document-upload.ts streaming), and document-stages.ts enforces the tenant/agent key prefix before the worker reads an object. Hostile-file parsing and the tenant-key check both want a deep read. Overlaps the qa-extraction*.ts ai-prompts entry, which stays for its family. Raised by Guardian's review of chatbots#98 (dev-team#91)."

  # --- 2026-10-13: the adversarial eval suite, found by Guardian's review of chatbots#141.
  - glob: "tests/llm-security/**"
    family: ai-prompts
    added: 2026-10-13
    reason: "The adversarial eval suite (harness.ts and the *.evals.test.ts files). tool-runtime.evals.test.ts pins Leo's auto-tier allowlist (AUTO_TIER_ALLOWLIST) and says that adding to it is a security decision reviewed by Guardian; a one-line edit there changes what the model may do without the Admin confirming, and the suite stays green. The same 'a change here can mute a check' reasoning as tools/guardrails/src/**. None of the existing ai-prompts globs reach it, so chatbots#141 scanned Light. Raised by Guardian's review of chatbots#141."

  # --- agent-authority: an Iris project extension (IRS-81) ---
  # Config the agent harness reads, not the model: it grants an agent session permission
  # to act without asking. The rest of .claude/** is instructions and stays light.
  - glob: "**/.claude/settings*.json"
    family: agent-authority
    added: 2026-10-02
    reason: "Pre-approves tool calls for every agent session started in that directory, with no prompt. chatbots' copy allows 17 Linear write tools today. The same file can also define hooks, which run shell commands on session events. One added array element silently widens what an agent may do, and nothing visible changes at runtime: the next session just stops asking. That is the change a light read is least likely to question. `settings*` also catches settings.local.json if it is ever committed (it is gitignored today), and `**/` catches a nested copy, which applies to sessions started in that subdirectory. IRS-81 (Strategist curator sweep 2026-09-04, candidate 5)."
  - glob: "**/.mcp.json"
    family: agent-authority
    added: 2026-10-02
    reason: "Forward-looking: none exists in the target yet. It declares the MCP servers a project session connects to, including the command each one runs, so adding a server adds both an executable and a set of tools an agent can call. The same silent widening as .claude/settings*.json, which is why IRS-81 asked whether to include it. IRS-81."
